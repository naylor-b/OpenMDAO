
problem:
  type: openmdao.core.problem.Problem
  kwargs:
    name: Sellar_MDA

  model:
    type: openmdao.core.group.Group
    subsystems:
      - cycle:
          type: openmdao.core.group.Group
          subsystems:
            - d1: openmdao.test_suite.components.sellar.SellarDis1
              promotes_inputs: [x, z, y2]
              promotes_outputs: [y1]
            - d2: openmdao.test_suite.components.sellar.SellarDis2
              promotes_inputs: [z, y1]
              promotes_outputs: [y2]
          input_defaults:
            - z:
                src_shape: (2,)
          nonlinear_solver:
            type: openmdao.solvers.nonlinear.nonlinear_block_gs.NonlinearBlockGS
        promotes_inputs: [x, z]

      - obj_cmp:
          type: openmdao.components.exec_comp.ExecComp
          kwargs:
            exprs: obj = x**2 + z[1] + y1 + exp(-y2)
            z: [0.0, 0.0]
            x: 0.0
        promotes: [x, z, y1, y2, obj]

      - con_cmp1:
          type: openmdao.components.exec_comp.ExecComp
          kwargs:
            exprs: con1 = 3.16 - y1
        promotes: [con1, y1]

      - con_cmp2:
          type: openmdao.components.exec_comp.ExecComp
          kwargs:
            exprs: con2 = y2 - 24.0
        promotes: [con2, y2]

    # connections:
    #   - src: cycle.d1.y1
    #     tgt: [obj_cmp.y1, con_cmp1.y1]
    #   - src: cycle.d2.y2
    #     tgt: [obj_cmp.y2, con_cmp2.y2]

    design_variables:
      - x:
          lower: -1.
          upper: 10.
      - z:
          lower: -1.
          upper: 10.

    objectives:
      - obj_cmp.obj

    constraints:
      - con_cmp1.con1:
          upper: 0.
      - con_cmp2.con2:
          upper: 0.

  driver:
    type: openmdao.drivers.scipy_optimizer.ScipyOptimizeDriver
    options:
      optimizer: SLSQP
      tol: 1.0e-8


  # initial_values:
  #   x: 2.0
  #   z: [0.0, 0.0]
